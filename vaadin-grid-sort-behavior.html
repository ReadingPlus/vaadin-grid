<script>
  window.vaadin = window.vaadin || {};
  vaadin.elements = vaadin.elements || {};
  vaadin.elements.grid = vaadin.elements.grid || {};

  /**
   * @polymerBehavior vaadin.elements.grid.SortBehavior
   */
  vaadin.elements.grid.SortBehavior = {

    properties: {

      /*
       * When `true`, all `<vaadin-grid-sorter>` are applied for sorting.
       */
      multiSort: {
        type: Boolean,
        value: false
      },

      _sorters: {
        type: Array,
        value: function() {
          return [];
        }
      },

      _previousSorters: {
        type: Array,
        value: function() {
          return [];
        }
      }

    },

    listeners: {
      'sorter-changed': '_onSorterChanged'
    },

    ready: function() {
      // With Polymer 2 & shady the 'sorter-changed' listener isn't guaranteed to be registered
      // before child <vaadin-grid-sorter>'s upgrade and fire the events. The following
      // makes sure that 'sorter-changed' is fired for all <vaadin-grid-sorter> elements
      // after this (<vaadin-grid>) is ready (and the listeners are active).
      if (Polymer.Element && !Polymer.Settings.useNativeShadow) {
        this.async(function() {
          var sorters = Polymer.dom(this).querySelectorAll('vaadin-grid-sorter');
          Array.prototype.forEach.call(sorters, function(sorter) {
            // Don't try to fire if the sorter hasn't been upgraded yet
            if (sorter.fire) {
              sorter.fire('sorter-changed');
            }
          });
        });
      }
    },

      /**
       * Clear the current sort spec only if a new 'sorter.direction' is provided, in the end, you'll always have one sorter.
       * When the columnInfoList is updated, new headers are created / updated having a null path and direction,
       * which does not mean user changed the sort spec.
       **/
      _updateSingleSort: function (sorter) {
          if( sorter.direction ) {
              this._sorters.forEach(function (sorter) {
                  sorter._order = null;
                  sorter.direction = null;
              });
              this._sorters = [sorter];
          }
      },

      _onSorterChanged: function(e) {
        var sorter = e.path && e.path[0] || e.target;

        this._removeArrayItem(this._sorters, sorter);
        sorter._order = null;

        if (this.multiSort) {
          if (sorter.direction) {
            this._sorters.unshift(sorter);
          }

          this._sorters.forEach(function(sorter, index) {
            sorter._order = this._sorters.length > 1 ? index : null;
          }, this);
        } else {
            if( FeatureFlags.on('LIT-166') ) {
                this._updateSingleSort(sorter);
            } else {
                this._sorters.forEach(function(sorter) {
                    sorter._order = null;
                    sorter.direction = null;
                });

                if (sorter.direction) {
                    this._sorters = [sorter];
                }
            }
        }

      e.stopPropagation();

      if (this.dataProvider &&
        // No need to clear cache if sorters didn't change
        JSON.stringify(this._previousSorters) !== JSON.stringify(this._mapSorters())) {
        this.clearCache();
      }

      this._previousSorters = this._mapSorters();
    },

    _mapSorters: function() {
      return this._sorters.map(function(sorter) {
        return {
          path: sorter.path,
          direction: sorter.direction
        };
      });
    },

    _removeArrayItem: function(array, item) {
      /**
        Sorter or item is updated when you change columnInfoList, e.g.
         1. you have A,B columns, which have sorter A1 & B1 and the current sorter is B1, then
         2. column C is added so
         3. Three new columns are created with a new sorters A2, B2, C1.
         4. When we send the event to reset last sorter the current sorter in the array is B1 however the new column B
            has a new sorter B2, that's why I compare sorter with their path name.
       So, if you don't remove the item using path attribute, its direction will be cleared, which is not the desired behavior.
       **/
      var index;
      if( FeatureFlags.on('LIT-166') ) {
          index = array.findIndex(function(sItem) {
              return sItem === item || sItem.path === item.path;
          });
      } else {
          index = array.indexOf(item);
      }
      if (index > -1) {
        array.splice(index, 1);
      }
    },

  };
</script>
